
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030912">
<title>J.A.R.V.I.S.</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030912;color:#dffaff;
 font-family:Arial,sans-serif;min-height:100vh;
}
main{max-width:650px;margin:auto;padding:20px}
header{text-align:center;padding:25px 0}
h1{color:#42dfff;letter-spacing:8px;
 text-shadow:0 0 20px #00aaff}
.status{color:#40e6b6;font-size:12px}
.core{
 width:180px;height:180px;margin:25px auto;
 border:2px solid #36d9ff;border-radius:50%;
 display:grid;place-items:center;
 box-shadow:0 0 30px #008ac0,inset 0 0 30px #008ac0;
 animation:pulse 3s infinite;
}
.core span{font-size:75px;color:#60eaff}
@keyframes pulse{
 50%{box-shadow:0 0 55px #00bfff,inset 0 0 45px #008ac0}
}
.panel{
 background:#0a1928;border:1px solid #14516a;
 padding:16px;border-radius:15px;margin-top:16px;
}
#chat{height:280px;overflow-y:auto}
.msg{padding:12px;margin:9px 0;border-radius:10px;
 font-size:14px;line-height:1.5;white-space:pre-wrap}
.bot{background:#102e43}
.user{background:#164354;text-align:right}
.controls{display:flex;gap:7px;margin-top:12px}
input{
 flex:1;min-width:0;background:#06111e;
 border:1px solid #23627d;border-radius:10px;
 padding:13px;color:white;font-size:15px
}
button{
 background:#087da5;color:white;border:0;
 border-radius:10px;padding:12px;font-weight:bold
}
button:active{opacity:.7}
.mic{font-size:19px}
.small{font-size:12px;color:#8db6c8;line-height:1.7}
</style>
</head>
<body>
<main>
<header>
 <div class="status">● SISTEMA INICIALIZADO</div>
 <h1>J.A.R.V.I.S.</h1>
 <div class="small">ASSISTENTE PESSOAL INTELIGENTE</div>
</header>

<div class="core"><span>◉</span></div>
<div class="status" id="state" style="text-align:center">
 AGUARDANDO COMANDO
</div>

<section class="panel">
<strong>Central de comunicação</strong>
<div id="chat">
<div class="msg bot">JARVIS: Olá! Sistemas inicializados. Estou aguardando suas instruções.</div>
</div>
<div class="controls">
<input id="message" placeholder="Digite um comando...">
<button onclick="send()">Enviar</button>
<button class="mic" onclick="listen()">🎙️</button>
</div>
</section>

<section class="panel">
<strong>Comandos de teste</strong>
<p class="small">
• Que horas são?<br>
• Que dia é hoje?<br>
• Quem é você?<br>
• Abrir YouTube<br>
• Ajuda
</p>
</section>
</main>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const state=document.getElementById("state");

function add(text,type){
 const el=document.createElement("div");
 el.className="msg "+type;
 el.textContent=text;
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
}

function speak(text){
 if(!window.speechSynthesis)return;
 speechSynthesis.cancel();
 const s=new SpeechSynthesisUtterance(text);
 s.lang="pt-BR";
 s.rate=.92;
 s.pitch=.82;
 s.onstart=()=>state.textContent="JARVIS RESPONDENDO";
 s.onend=()=>state.textContent="AGUARDANDO COMANDO";
 speechSynthesis.speak(s);
}
async function answer(text){
  state.textContent = "CONSULTANDO GEMINI...";

 try {
 const response = await fetch(
 "https://falling-term-1639.paulovictor-oficial2022.workers.dev/",
    {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: text })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Falha na conexão");
    }

    const r = data.answer || "Não consegui responder.";
    add("JARVIS: " + r, "bot");
    speak(r);
}
 if(t.includes("hora"))
 r="Agora são "+new Date().toLocaleTimeString("pt-BR")+".";
 else if(t.includes("dia")||t.includes("data"))
 r="Hoje é "+new Date().toLocaleDateString("pt-BR",{dateStyle:"full"})+".";
 else if(t.includes("quem é você")||t.includes("seu nome"))
 r="Sou JARVIS, seu assistente pessoal. Estou pronto para ajudá-lo.";
 else if(t.includes("olá")||t.includes("oi"))
 r="Olá! É um prazer falar com você. Como posso ajudar?";
 else if(t.includes("ajuda"))
 r="Posso informar as horas, a data, conversar e abrir o YouTube. Minha inteligência artificial completa será conectada em breve.";
 else if(t.includes("abrir youtube")){
 r="Abrindo o YouTube.";
 window.open("https://www.youtube.com/","_blank");
 }

 add("JARVIS: "+r,"bot");
 speak(r);
}

function send(){
 const t=input.value.trim();
 if(!t)return;
 add("VOCÊ: "+t,"user");
 input.value="";
 answer(t);
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});

function listen(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){
 add("JARVIS: Reconhecimento de voz não disponível neste navegador.","bot");
 return;
 }
 const rec=new SR();
 rec.lang="pt-BR";
 rec.onstart=()=>state.textContent="ESCUTANDO...";
 rec.onresult=e=>{
 input.value=e.results[0][0].transcript;
 send();
 };
 rec.onerror=()=>state.textContent="ERRO NO MICROFONE";
 rec.onend=()=>{
 if(state.textContent==="ESCUTANDO...")
 state.textContent="AGUARDANDO COMANDO";
 };
 rec.start();
}
</script>
</body>
</html>
